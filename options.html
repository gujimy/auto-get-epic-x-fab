<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Epic/Fab 每周免费助手设置</title>
    <link rel="stylesheet" href="popup.css" />
    <style>
      body {
        min-width: auto;
      }

      .page {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 16px 48px;
      }

      .form {
        display: grid;
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
      }

      input,
      select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        color: var(--text);
        background: var(--panel-strong);
      }

      .checkbox {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text);
      }

      .checkbox input {
        width: auto;
      }

      .hint {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">设置</p>
        <h1>Epic/Fab 每周免费助手</h1>
        <p class="meta">建议先确保浏览器里已经登录 Epic 与 Fab。</p>
      </header>

      <section class="panel">
        <div class="form">
          <label class="checkbox">
            <input id="autoCheck" type="checkbox" />
            <span>开启自动检测</span>
          </label>

          <label class="checkbox">
            <input id="autoClaimEpic" type="checkbox" />
            <span>自动领取 Epic 周免</span>
          </label>

          <label class="checkbox">
            <input id="autoClaimFab" type="checkbox" />
            <span>自动领取 Fab 限免</span>
          </label>

          <label class="checkbox">
            <input id="desktopNotifications" type="checkbox" />
            <span>开启浏览器通知</span>
          </label>

          <label class="checkbox">
            <input id="closeFinishedTabs" type="checkbox" />
            <span>执行完成后自动关闭后台标签页</span>
          </label>

          <label>
            <span>检测间隔（分钟）</span>
            <input id="checkIntervalMinutes" type="number" min="30" step="30" />
          </label>

          <label>
            <span>Epic 区域代码</span>
            <input id="country" type="text" maxlength="2" />
          </label>

          <label>
            <span>Epic 语言</span>
            <select id="locale">
              <option value="zh-CN">简体中文</option>
              <option value="en-US">English (US)</option>
            </select>
          </label>
        </div>
      </section>

      <section class="panel">
        <button id="saveButton" class="primary">保存设置</button>
        <p id="statusText" class="hint">尚未保存</p>
      </section>
    </main>

    <script src="common.js"></script>
    <script src="options.js"></script>
  </body>
</html>
